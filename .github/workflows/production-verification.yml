name: Temporary production verification
on:
  workflow_dispatch:
  push:
    branches: [arena/187a72ae-agent-collab]
    paths: ['.github/workflows/production-verification.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-fund --no-audit
      - run: npx playwright install --with-deps chromium
      - name: Verify production authentication and browser experience
        run: node scripts/production-verification.mjs
      - name: Persist sanitized evidence through GitHub API
        if: always()
        run: |
          node --input-type=module <<'NODE'
          const fs = await import('node:fs/promises');
          let content;
          try { content = (await fs.readFile('production-evidence.json')).toString('base64'); }
          catch { content = Buffer.from(JSON.stringify({error:'verification did not produce evidence'})).toString('base64'); }
          const url = 'https://api.github.com/repos/${{ github.repository }}/contents/production-evidence.json';
          const headers = { authorization: `Bearer ${{ github.token }}`, accept: 'application/vnd.github+json', 'content-type': 'application/json' };
          const existing = await fetch(url + '?ref=${{ github.ref_name }}', { headers });
          const sha = existing.ok ? (await existing.json()).sha : undefined;
          const result = await fetch(url, { method: 'PUT', headers, body: JSON.stringify({ message: 'Record sanitized production verification', content, branch: '${{ github.ref_name }}', ...(sha ? {sha} : {}) }) });
          if (!result.ok) throw new Error(`Evidence persistence failed: ${result.status}`);
          NODE
