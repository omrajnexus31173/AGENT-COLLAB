name: Temporary production signup diagnostic
on:
  workflow_dispatch:
  push:
    branches: [arena/187a72ae-agent-collab]
    paths: ['.github/workflows/production-diagnostic.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture the real production signup response without credentials
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto';
          const base = 'https://nexus-agent-collab.vercel.app';
          const password = randomBytes(24).toString('base64url');
          const email = `nexus-diagnostic-${Date.now()}@example.com`;
          for (const path of ['/api/health', '/api/auth/session']) {
            const r = await fetch(base + path, { signal: AbortSignal.timeout(20000) });
            console.log(JSON.stringify({ path, status: r.status, requestId: r.headers.get('x-vercel-id'), body: await r.json() }));
          }
          const response = await fetch(base + '/api/auth/signup', {
            method: 'POST',
            headers: { 'content-type': 'application/json', origin: base },
            body: JSON.stringify({ name: 'Production Diagnostic', email, password }),
            signal: AbortSignal.timeout(30000),
          });
          const text = await response.text();
          let body;
          try {
            body = JSON.parse(text);
            if (body.csrfToken) body.csrfToken = '[REDACTED]';
            if (body.user) body.user = '[REDACTED]';
          } catch { body = text.slice(0, 1500); }
          const evidence = JSON.stringify({
            path: '/api/auth/signup', method: 'POST', status: response.status,
            contentType: response.headers.get('content-type'),
            requestId: response.headers.get('x-vercel-id'),
            server: response.headers.get('server'),
            setCookiePresent: response.headers.getSetCookie().length > 0,
            body,
          });
          console.log(evidence);
          const fs = await import('node:fs/promises');
          await fs.writeFile('diagnostic-evidence.json', evidence + '\n');
          if (response.status === 201) {
            console.log('Unexpected success before configuration repair; test account requires cleanup:', email);
            process.exitCode = 1;
          }
          NODE
      - name: Persist sanitized evidence through GitHub API (log CDN is unreachable from the agent)
        run: |
          node --input-type=module <<'NODE'
          const fs = await import('node:fs/promises');
          const content = (await fs.readFile('diagnostic-evidence.json')).toString('base64');
          const url = 'https://api.github.com/repos/${{ github.repository }}/contents/diagnostic-evidence.json';
          const headers = { authorization: `Bearer ${{ github.token }}`, accept: 'application/vnd.github+json', 'content-type': 'application/json' };
          const existing = await fetch(url + '?ref=${{ github.ref_name }}', { headers });
          const sha = existing.ok ? (await existing.json()).sha : undefined;
          const result = await fetch(url, { method: 'PUT', headers, body: JSON.stringify({ message: 'Record sanitized production signup diagnostic', content, branch: '${{ github.ref_name }}', ...(sha ? {sha} : {}) }) });
          if (!result.ok) throw new Error(`Evidence persistence failed: ${result.status}`);
          NODE
